version: '3.8'

services:
  db:
    image: postgres:16
    container_name: it_support_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: it_support
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: it_support_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgrespassword@db:5432/it_support
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.1-8b-instant}
      - GROQ_BASE_URL=${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      - SECRET_KEY=it-support-portal-super-secret-jwt-key-2026-production-ready
    ports:
      - "8000:8000"
    depends_on:
      - db
    command: >
      sh -c "python seed_data.py && python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: it_support_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
